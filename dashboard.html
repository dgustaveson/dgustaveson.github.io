<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Polis CSV Visualizer</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ml-pca@1.1.3/lib/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <style>
    body { font-family: sans-serif; margin: 20px; }
    #chart { width: 800px; height: 600px; border: 1px solid #ccc; }
    #comments { margin-top: 20px; }
    .point { opacity: 0.7; }
    .highlight { stroke: black; stroke-width: 2px; }
  </style>
</head>

<body>
  <h2>Polis CSV Visualizer</h2>
  <p>Make sure your CSV is named <b>data.csv</b> and is in the same folder as this file.</p>

  <div id="chart"></div>
  <div id="comments"></div>

<script>
Papa.parse("data.csv", {
  download: true,
  header: true,
  complete: function(results) {
    const rows = results.data;

    // Extract vote matrix (participants × comments)
    const commentKeys = Object.keys(rows[0]).filter(k => k.startsWith("comment_"));
    const matrix = rows.map(r => commentKeys.map(k => Number(r[k] || 0)));

    // PCA → 2D
    const pca = new PCA(matrix);
    const coords = pca.predict(matrix, { nComponents: 2 }).to2DArray();

    // Build scatterplot
    const width = 800, height = 600;
    const svg = d3.select("#chart").append("svg")
      .attr("width", width)
      .attr("height", height);

    const x = d3.scaleLinear()
      .domain(d3.extent(coords, d => d[0]))
      .range([40, width - 40]);

    const y = d3.scaleLinear()
      .domain(d3.extent(coords, d => d[1]))
      .range([height - 40, 40]);

    svg.selectAll("circle")
      .data(coords)
      .enter()
      .append("circle")
      .attr("class", "point")
      .attr("cx", d => x(d[0]))
      .attr("cy", d => y(d[1]))
      .attr("r", 5)
      .attr("fill", "#4a90e2");

    // Comment list
    const commentList = d3.select("#comments")
      .append("div")
      .selectAll("div")
      .data(commentKeys)
      .enter()
      .append("div")
      .style("margin", "6px 0")
      .style("cursor", "pointer")
      .text(d => d)
      .on("click", function(commentKey) {
        const idx = commentKeys.indexOf(commentKey);

        svg.selectAll("circle")
          .attr("fill", (d, i) => {
            const vote = matrix[i][idx];
            if (vote === 1) return "green";
            if (vote === -1) return "red";
            return "#ccc";
          });
      });
  }
});
</script>

</body>
  </html>
